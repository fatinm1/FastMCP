[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "govcon-mcp"
version = "0.1.0"
description = "MCP server for U.S. federal contracting intelligence — SAM.gov + USASpending.gov + RAG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
govcon-mcp = "server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["clients"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
